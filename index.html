<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Radio Portal Pro | Premium Studio Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dynamic-bg mega" id="dynamicBg"></div>
    <div class="particles" id="particles"></div>

    <div class="app-container">
        <div class="header">
            <div class="live-pill">
                <div class="live-dot"></div>
                <span class="live-text">EN VIVO</span>
                <span class="station-name-badge" id="stationBadge">LA MEGA 95.3</span>
            </div>
            <div class="menu-btn" id="menuBtn">
                <i class="fa-solid fa-bars-staggered"></i>
            </div>
        </div>

        <div class="station-tabs">
            <button class="tab active" data-station="mega" id="tabMega">
                <i class="fa-solid fa-tower-cell"></i> LA MEGA
            </button>
            <button class="tab" data-station="buena" id="tabBuena">
                <i class="fa-solid fa-star"></i> LA MÁS BUENA
            </button>
        </div>

        <!-- Player -->
        <div class="player">
            <div class="album-art">
                <img id="albumImg" class="album-img" src="https://i.imgur.com/8gY5kZF.png" alt="cover">
                <div class="album-ring" id="albumRing"></div>
            </div>
            <div class="station-title" id="stationTitle">LA MEGA <span>95.3</span></div>
            <div class="station-slogan" id="stationSlogan">"Desde Ciudad Arce para el Mundo"</div>
            <div class="frequency" id="frequency">FM 95.3 MHz</div>
            
            <div class="visualizer" id="visualizer"></div>
            
            <button class="play-btn" id="playBtn">
                <i class="fa-solid fa-play" id="playIcon"></i>
            </button>
            
            <div class="volume-control">
                <i class="fa-solid fa-volume-low"></i>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.02" value="0.75">
                <i class="fa-solid fa-volume-high"></i>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-sheet">
            <div class="modal-close">
                <button class="close-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-content">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
                    <i class="fa-solid fa-tower-broadcast" style="font-size: 1.8rem; color: var(--modal-icon, #ff4d1e);"></i>
                    <h3 style="font-size: 1.3rem;" id="modalTitle">La Mega 95.3</h3>
                </div>
                
                <div class="modal-section-title"><i class="fa-solid fa-share-nodes"></i> CONECTA CON NOSOTROS</div>
                <div class="social-grid" id="socialLinks"></div>
                
                <div class="modal-section-title"><i class="fa-solid fa-microphone-lines"></i> LOCUTORES</div>
                <div class="person-grid" id="locutoresGrid"></div>
                
                <div class="modal-section-title"><i class="fa-solid fa-briefcase"></i> ADMINISTRACIÓN</div>
                <div class="person-grid" id="adminGrid"></div>
                
                <div class="modal-section-title"><i class="fa-solid fa-location-dot"></i> UBICACIÓN</div>
                <div class="location-card">
                    <p id="addressText"></p>
                    <a href="#" id="mapLink" target="_blank" class="map-link"><i class="fa-solid fa-location-arrow"></i> Cómo llegar</a>
                </div>
                
                <div class="accordion">
                    <button class="accordion-btn" id="accordionBtn">
                        <span><i class="fa-regular fa-compass"></i> SABER MÁS</span>
                        <i class="fa-solid fa-chevron-down" id="accordIcon"></i>
                    </button>
                    <div class="accordion-content" id="accordContent">
                        <div style="margin-bottom: 12px;"><strong>Misión:</strong><p id="misionText" style="margin-top: 5px; opacity: 0.8;"></p></div>
                        <div><strong>Visión:</strong><p id="visionText" style="margin-top: 5px; opacity: 0.8;"></p></div>
                    </div>
                </div>
                
                <div class="modal-footer" id="hoursFooter"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
